# Font
font_family Fira Code
bold_font auto
italic_font auto
font_size 13.5

# Colors (dark modern theme)
background #1e1e2e
foreground #cdd6f4
cursor #f5c2e7
selection_foreground #cdd6f4
selection_background #45475a

# Padding & scrolling
window_padding_width 10
scrollback_lines 10000
hide_mouse_cursor_when_typing yes

# Tabs (if you use them)
active_tab_background #313244
active_tab_foreground #cdd6f4
inactive_tab_background #1e1e2e
inactive_tab_foreground #6c7086

# Other
cursor_shape block
enable_audio_bell no
background_opacity 0.85

# Make Git branches, diffs, and errors stand out
foreground #cdd6f4
cursor #f5c2e7
selection_background #45475a
# Optional: bold important things
bold_bright_colors yes
confirm_os_window_close 0
